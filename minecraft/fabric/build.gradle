plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	runs {
		client {
			// `./gradlew :fabric:runClient -PmcskylinesHidden` starts the dev client with its window hidden.
			if (project.hasProperty('mcskylinesHidden')) {
				vmArg '-Dmcskylines.startHidden=true'
			}
			// `-PmcskylinesDebugCommands` lets the host run server commands in the dev world (automated in-game tests).
			if (project.hasProperty('mcskylinesDebugCommands')) {
				vmArg '-Dmcskylines.debugCommands=true'
			}
		}
	}
}

base {
	archivesName = 'mcskylines'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':bridge')
	include project(':bridge')

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
	systemProperty 'mcskylines.vectors', rootProject.file('../protocol/vectors').absolutePath
	// @TempDir lives under build/ (the agent sandbox's /tmp is read-only) and is never deleted (AGENTS.md: no
	// deleting code, tests included); the owner clears build/tmp/test-tmp by hand.
	def testTmp = layout.buildDirectory.dir('tmp/test-tmp').get().asFile
	systemProperty 'java.io.tmpdir', testTmp.absolutePath
	systemProperty 'junit.jupiter.tempdir.cleanup.mode.default', 'never'
	doFirst { testTmp.mkdirs() }
}
